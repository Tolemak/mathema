name: mathema-api

services:
  mathema-api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    init: true
    mem_limit: 224m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:40056:3000"
